<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#061216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uptime" />
    <title>Sign in — Uptime</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="hero hero--login">
      <div class="hero__atmosphere" aria-hidden="true"></div>
      <div class="hero__logo-wrap" id="hero-logo">
        <img
          class="hero__logo"
          src="https://images.fotmob.com/image_resources/logo/teamlogo/10185.png"
          alt="Maccabi Haifa"
          width="160"
          height="160"
        />
      </div>
      <div class="hero__signals" id="hero-signals" aria-hidden="true"></div>

      <div class="login-card">
        <p class="login-card__brand">Uptime</p>
        <h1>Sign in</h1>
        <p class="login-card__lede">Access the Maccabi Haifa dashboard.</p>

        <form id="login-form" class="login-form" novalidate>
          <label class="login-field">
            <span class="login-field__label">Username</span>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </label>

          <label class="login-field">
            <span class="login-field__label">Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <p id="login-error" class="login-form__error" hidden></p>

          <button type="submit" class="login-form__submit">Sign in</button>
        </form>

        <p class="login-card__footer">
          <a href="/register">Create an account</a>
        </p>
      </div>
    </main>

    <script src="/shell.js"></script>
    <script src="/hero.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
